name: Todoist Discovery
on:
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todoist-discovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TEST_INCLUDE_MANUAL: 'false'

jobs:
  test:
    if: github.ref == 'refs/heads/master'
    name: Todoist discovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepublishOnly
      - run: npm test -- --grep "integration/auth/todoist-oauth Discovery" --bail
